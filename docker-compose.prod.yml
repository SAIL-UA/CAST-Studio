services:
  db:
    image: postgres:17
    container_name: cast-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cast-network

  redis:
    image: redis:7-alpine
    container_name: cast-redis
    restart: unless-stopped
    networks:
      - cast-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cast-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - /data/CAST_ext/user_images:/data/CAST_ext/user_images
      - static:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8051 --workers 3"
    networks:
      - cast-network

  daphne:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cast-daphne
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - /data/CAST_ext/user_images:/data/CAST_ext/user_images
      - static:/app/staticfiles
    command: daphne -b 0.0.0.0 -p 8052 config.asgi:application
    networks:
      - cast-network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cast-celery
    restart: unless-stopped
    volumes:
      - /data/CAST_ext/user_images:/data/CAST_ext/user_images:ro
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A config worker --loglevel=info
    networks:
      - cast-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cast-frontend
    restart: unless-stopped
    volumes:
      - frontend_build:/shared-build
    networks:
      - cast-network

  nginx:
    image: nginx:alpine
    container_name: cast-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/project.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/var/www/html
      - static:/staticfiles:ro
      - nginx-logs:/var/log/nginx
      - /data/CAST_ext/user_images:/data/CAST_ext/user_images:ro
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    depends_on:
      - backend
      - daphne
      - frontend
    restart: always
    networks:
      - cast-network

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    networks:
      - cast-network

  jupyterhub:
    build:
      context: /home/aii03admin/CAST_ext
      dockerfile: Dockerfile
    container_name: cast-jupyterhub
    env_file:
      - .env
    volumes:
      - /home/aii03admin/CAST_ext:/app
      - /data/user_images:/data/user_images
      - /data/CAST_ext/users:/data/CAST_ext/users
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - cast-network

networks:
  cast-network:
    external: true

volumes:
  db_data:
  nginx-logs:
  frontend_build:
  static:
