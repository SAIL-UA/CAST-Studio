services:
    db:
        image: postgres:17
        container_name: cast-db-dev
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - db_data:/var/lib/postgresql/data
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    redis:
        image: redis:7-alpine
        container_name: cast-redis-dev
        restart: unless-stopped

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        container_name: cast-backend-dev
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        env_file:
            - .env
        volumes:
            - ./backend:/app
            - ./data:/data
            - static:/app/staticfiles
        command: >
            sh -c "python manage.py migrate &&
                   python manage.py collectstatic --noinput &&
                   gunicorn config.wsgi:application --bind 0.0.0.0:8051 --workers 3 --reload --reload-engine=poll"

    daphne:
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        container_name: cast-daphne-dev
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        env_file:
            - .env
        volumes:
            - ./data:/data
        command: daphne -b 0.0.0.0 -p 8052 config.asgi:application

    celery:
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        container_name: cast-celery-dev
        restart: unless-stopped
        volumes:
            - ./data:/data
        env_file:
            - .env
        depends_on:
            - db
            - redis
        command: celery -A config worker --loglevel=info

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        container_name: cast-frontend-dev
        restart: unless-stopped
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:8050/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 5s
            retries: 24
            start_period: 40s

    nginx:
        image: nginx:alpine
        container_name: cast-nginx-dev
        ports:
            - "80:80"
        volumes:
            - ./nginx/project.dev.conf:/etc/nginx/conf.d/default.conf
            - static:/staticfiles:ro
            - ./data/user_images:/data/user_images:ro
        depends_on:
            backend:
                condition: service_started
            daphne:
                condition: service_started
            frontend:
                condition: service_healthy
        restart: unless-stopped

volumes:
    db_data:
    static:
    frontend_node_modules:
