# HTTP-only server for local development
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Docker embedded DNS — resolve upstreams at request time so nginx
    # does not crash if a sibling container is still starting or restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Allow larger file uploads (CSV files, images, etc.)
    client_max_body_size 100M;

    # Vite dev server (HMR websocket uses the same origin on port 80)
    location / {
        set $frontend_upstream http://frontend:8050;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Serve Backend Static Files
    location /backend_static/ {
        alias /staticfiles/;
    }

    location /images/ {
        alias /data/user_images/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }

    # WebSocket connections to Daphne (ASGI)
    location /ws/ {
        set $daphne_upstream http://daphne:8052;
        proxy_pass $daphne_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Proxy API requests to Django backend
    location /api/ {
        set $backend_upstream http://backend:8051;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users/ {
        set $backend_upstream http://backend:8051;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /admin/ {
        # Remove IP restrictions for local development
        set $backend_upstream http://backend:8051;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
