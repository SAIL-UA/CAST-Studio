# HTTP-only server for local development
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Allow larger file uploads (CSV files, images, etc.)
    client_max_body_size 100M;

    # Proxy React frontend (webpack-dev-server with hot reload)
    location / {
        proxy_pass http://frontend:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # CRA HMR websocket (not /ws — that path is Daphne)
    location /wds {
        proxy_pass http://frontend:8050/wds;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Serve Backend Static Files
    location /backend_static/ {
        alias /staticfiles/;
    }

    location /images/ {
        alias /data/user_images/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
    }

    # WebSocket connections to Daphne (ASGI)
    location /ws/ {
        proxy_pass http://daphne:8052/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Proxy API requests to Django backend
    location /api/ {
        proxy_pass http://backend:8051/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users/ {
        proxy_pass http://backend:8051/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JupyterHub disabled for local development
    # location /jupyterhub/ {
    #     proxy_pass http://jupyterhub:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    location /admin/ {
        # Remove IP restrictions for local development
        proxy_pass http://backend:8051/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
